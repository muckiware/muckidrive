name: Release

# A release version is cut only from the release branch: merge (or push)
# main into release and this workflow verifies the tree, computes the next
# version (patch bump of the latest v* tag, overridable via the version
# dispatch input), moves the unreleased changelog entries into
# changelog/release-<x-y-z>/, tags, publishes the GitHub release and
# triggers the MuckiSafe image build.
# Git tags are created BY this workflow - pushing a tag alone does nothing.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit release version (optional, e.g. 0.2.0) - otherwise the latest tag is patch-bumped'
        required: false
        default: ''
    branches: [release]

permissions:
  contents: write

# Serialize releases: a second push to release waits for the running
# release, so version computation never races.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-dist:
    name: Verify the release tree installs via composer create-project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo, pdo_mysql, session, simplexml, sodium, xml, xmlreader, zip, zlib
          coverage: none

      - name: composer create-project smoke test (release branch HEAD)
        run: |
          composer create-project muckiware/muckidrive dist-test dev-release \
            --stability=dev \
            --repository="{\"type\":\"vcs\",\"url\":\"$GITHUB_WORKSPACE\"}" \
            --no-interaction --no-progress

  release:
    name: Version, tag, GitHub release + MuckiSafe trigger
    needs: verify-dist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            if [ -z "$LATEST" ]; then
              echo "::error::No previous v* tag found for an automatic patch bump - pass an explicit version via workflow dispatch."
              exit 1
            fi
            VERSION="${LATEST#v}"
            VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."($3+1)}')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' - expected X.Y.Z."
            exit 1
          fi
          echo "Next release version: v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Move unreleased changelog entries and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          DIR="changelog/release-$(echo "$VERSION" | tr '.' '-')"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists - continuing with the existing tag (retry after a partial run)."
          else
            moved=0
            for entry in changelog/_unreleased/*.md; do
              if [ ! -e "$entry" ]; then
                continue
              fi
              if [ "$(basename "$entry")" = "README.md" ]; then
                continue
              fi
              if [ "$moved" -eq 0 ]; then
                mkdir -p "$DIR"
                moved=1
              fi
              git mv "$entry" "$DIR/"
            done
            if [ "$moved" -eq 1 ]; then
              git commit -q -m "Move unreleased changelog entries to ${DIR} [skip ci]"
              git push origin HEAD:release
              if git push origin HEAD:main 2>/dev/null; then
                echo "Changelog move synced back to main (fast-forward)."
              else
                echo "::warning::main has advanced since the release merge - merge release back into main to sync the changelog move."
              fi
            fi
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p .github-out
          bash .github/bin/generate-release-notes.sh "$TAG" > .github-out/notes.md
          cat .github-out/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping creation (retry after a partial run)."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG" \
              --notes-file .github-out/notes.md
          fi

      - name: Trigger MuckiSafe image build
        env:
          DISPATCH_TOKEN: ${{ secrets.MUCKISAFE_DISPATCH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::MUCKISAFE_DISPATCH_TOKEN is not set - skipping the MuckiSafe image build trigger."
            echo "Add a fine-grained PAT with 'contents: write' on muckiware/MuckiSafe as a repository secret to enable it."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o dispatch-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/muckiware/MuckiSafe/dispatches \
            -d "{\"event_type\":\"muckidrive-release\",\"client_payload\":{\"muckidrive_ref\":\"$TAG\"}}")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "MuckiSafe dispatch accepted (HTTP $HTTP_CODE)."
          else
            echo "::error::MuckiSafe dispatch failed (HTTP $HTTP_CODE):"
            cat dispatch-response.json
            exit 1
          fi
